services:
  # API Gateway
  api-gateway:
    build:
      context: ./backend/services/api-gateway
    container_name: tomobilty-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AUTH_URL: http://auth-service:8001
      RENTAL_URL: http://rental-service:8002
      INVOICE_URL: http://invoice-service:8003
      OCR_URL: http://ocr-service:8004
      CHAT_URL: http://chatbot-service:8005
      PAYMENT_URL: http://payment-service:8006
      ADMIN_URL: http://admin-service:8007
    depends_on:
      - auth-service
      - rental-service
      - invoice-service
      - ocr-service
      - chatbot-service
    networks:
      - tomobilty-network

  # Auth Service and DB
  auth-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./backend/services/auth-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  auth-service:
    build:
      context: ./backend/services/auth-service
    container_name: tomobilty-auth-service
    environment:
      PORT: 8001
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: auth_password
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      FRONTEND_URL: http://localhost:3000
      GATEWAY_URL: http://localhost:8000
      EMAIL_HOST:
      EMAIL_PORT: 587
      EMAIL_SECURE: false
      EMAIL_USER:
      EMAIL_PASS:
      EMAIL_FROM: "Tomobilty <noreply@tomobilty.ma>"
      GOOGLE_CLIENT_ID:
      TWILIO_ACCOUNT_SID:
      TWILIO_AUTH_TOKEN:
      TWILIO_FROM:
    depends_on:
      - auth-postgres
    networks:
      - tomobilty-network

  # Rental Service and DB
  rental-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-rental-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
    volumes:
      - rental_data:/var/lib/postgresql/data
      - ./backend/services/rental-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  rental-service:
    build:
      context: ./backend/services/rental-service
    container_name: tomobilty-rental-service
    environment:
      PORT: 8002
      DB_HOST: rental-postgres
      DB_PORT: 5432
      DB_NAME: rental_db
      DB_USER: rental_user
      DB_PASSWORD: rental_password
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      - rental-postgres
    volumes:
      - ./public/uploads:/app/uploads
    networks:
      - tomobilty-network

  # Invoice Service and DB
  invoice-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-invoice-postgres
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: invoice_user
      POSTGRES_PASSWORD: invoice_password
    volumes:
      - invoice_data:/var/lib/postgresql/data
      - ./backend/services/invoice-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  invoice-service:
    build:
      context: ./backend/services/invoice-service
    container_name: tomobilty-invoice-service
    environment:
      PORT: 8003
      DB_HOST: invoice-postgres
      DB_PORT: 5432
      DB_NAME: invoice_db
      DB_USER: invoice_user
      DB_PASSWORD: invoice_password
    depends_on:
      - invoice-postgres
    networks:
      - tomobilty-network

  # OCR Service and DB
  ocr-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-ocr-postgres
    environment:
      POSTGRES_DB: ocr_db
      POSTGRES_USER: ocr_user
      POSTGRES_PASSWORD: ocr_password
    volumes:
      - ocr_data:/var/lib/postgresql/data
      - ./backend/services/ocr-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  ocr-service:
    build:
      context: ./backend/services/ocr-service
    container_name: tomobilty-ocr-service
    environment:
      PORT: 8004
      DB_HOST: ocr-postgres
      DB_PORT: 5432
      DB_NAME: ocr_db
      DB_USER: ocr_user
      DB_PASSWORD: ocr_password
    depends_on:
      - ocr-postgres
    networks:
      - tomobilty-network

  # Chatbot Service and DB
  chatbot-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-chatbot-postgres
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
    volumes:
      - chatbot_data:/var/lib/postgresql/data
      - ./backend/services/chatbot-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  chatbot-service:
    build:
      context: ./backend/services/chatbot-service
    container_name: tomobilty-chatbot-service
    environment:
      PORT: 8005
      DB_HOST: chatbot-postgres
      DB_PORT: 5432
      DB_NAME: chatbot_db
      DB_USER: chatbot_user
      DB_PASSWORD: chatbot_password
    depends_on:
      - chatbot-postgres
    networks:
      - tomobilty-network

  # Payment Service and DB
  payment-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    volumes:
      - payment_data:/var/lib/postgresql/data
      - ./backend/services/payment-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  payment-service:
    build:
      context: ./backend/services/payment-service
    container_name: tomobilty-payment-service
    environment:
      PORT: 8006
      DB_HOST: payment-postgres
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: payment_user
      DB_PASSWORD: payment_password
      FRONTEND_URL: http://localhost:3000
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
    depends_on:
      - payment-postgres
    networks:
      - tomobilty-network

  # Admin Service and DB
  admin-postgres:
    image: postgres:15-alpine
    container_name: tomobilty-admin-postgres
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
    volumes:
      - admin_data:/var/lib/postgresql/data
      - ./backend/services/admin-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tomobilty-network
  admin-service:
    build:
      context: ./backend/services/admin-service
    container_name: tomobilty-admin-service
    environment:
      PORT: 8007
      DB_HOST: admin-postgres
      DB_PORT: 5432
      DB_NAME: admin_db
      DB_USER: admin_user
      DB_PASSWORD: admin_password
    depends_on:
      - admin-postgres
    networks:
      - tomobilty-network

  # Application Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tomobilty-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
      NEXT_PUBLIC_CHECKOUT_PUBLIC_KEY:
    depends_on:
      - api-gateway
    networks:
      - tomobilty-network

volumes:
  postgres_data:
    driver: local
  auth_data:
    driver: local
  rental_data:
    driver: local
  invoice_data:
    driver: local
  ocr_data:
    driver: local
  chatbot_data:
    driver: local
  payment_data:
    driver: local
  admin_data:
    driver: local

networks:
  tomobilty-network:
    driver: bridge
